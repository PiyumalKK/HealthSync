name: HealthSync CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      api-gateway:
        description: '🚪 API Gateway'
        type: boolean
        default: false
      frontend:
        description: '🌐 Frontend'
        type: boolean
        default: false
      doctor-service:
        description: '🩺 Doctor Service'
        type: boolean
        default: false
      appointment-service:
        description: '📅 Appointment Service'
        type: boolean
        default: false
      patient-service:
        description: '🧑‍⚕️ Patient Service'
        type: boolean
        default: false
      prescription-service:
        description: '💊 Prescription Service'
        type: boolean
        default: false
      payment-service:
        description: '💳 Payment Service'
        type: boolean
        default: false
      notification-service:
        description: '🔔 Notification Service'
        type: boolean
        default: false
      deploy-all:
        description: '🚀 Deploy ALL services'
        type: boolean
        default: false

env:
  # Old infra:
  # ACR_NAME: crhealthsync
  # RESOURCE_GROUP: rg-healthsync-dev
  # STORAGE_ACCOUNT: sthealthsyncweb
  ACR_NAME: crhealthsyncc
  RESOURCE_GROUP: rg-healthsyncc-dev
  STORAGE_ACCOUNT: sthealthsynccweb

jobs:
  # ==================== API GATEWAY ====================

  sonar-api-gateway:
    if: ${{ github.event.inputs.api-gateway == 'true' || github.event.inputs.deploy-all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd services/api-gateway && npm install
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          args: >
            -Dsonar.projectBaseDir=services/api-gateway
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-api-gateway:
    if: ${{ github.event.inputs.api-gateway == 'true' || github.event.inputs.deploy-all == 'true' }}
    needs: [sonar-api-gateway]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}
      - name: Build & Push
         run: |
           docker build -t ${{ env.ACR_NAME }}.azurecr.io/api-gateway:${{ github.sha }} \
                        -t ${{ env.ACR_NAME }}.azurecr.io/api-gateway:latest \
                         -f services/api-gateway/Dockerfile services/api-gateway
